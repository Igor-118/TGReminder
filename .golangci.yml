version: "2"
linters:
  settings:
    copyloopvar:
      check-alias: false
    rowserrcheck:
      packages:
        - github.com/jackc/pgx/v5
  enable:
    - errcheck
    - copyloopvar
    - govet
    - ineffassign
    - staticcheck
    - unused
    - rowserrcheck
    - contextcheck
    - noctx
    - gosec
    - gocritic
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
        text: G101
